<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メイプルストーリー ボス・クエスト管理</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>🍄 Maplestory Tracker 🍁</h1 <p class="subtitle">週間・月間ボス & ウィークリークエスト トラッカー</p>
        </header>

        <div class="reset-info">
            <div class="reset-item current-time-item">
                <span class="label">現在</span>
                <span id="current-datetime" class="countdown current-time">--</span>
            </div>
            <div class="reset-item">
                <span class="label">週間リセットまで</span>
                <span id="weekly-countdown" class="countdown">--</span>
            </div>
            <div class="reset-item">
                <span class="label">月間リセットまで</span>
                <span id="monthly-countdown" class="countdown">--</span>
            </div>
            <button class="settings-btn" id="open-settings" title="設定">⚙️</button>
            <div class="external-link-container">
                <a href="https://syasta-lu.com/2026/02/21/maplestory-tracker-%e5%8f%96%e6%89%b1%e8%aa%ac%e6%98%8e%e6%9b%b8/"
                    class="external-link-btn" target="_blank" rel="noopener noreferrer">使い方(別ページ)</a>
                <a href="https://syasta913.github.io/LVUP-Planner/" class="external-link-btn gold-text" target="_blank"
                    rel="noopener noreferrer">育成プラン(別ページ)</a>
            </div>
        </div>

        <!-- 設定モーダル -->
        <div class="modal-overlay" id="settings-modal">
            <div class="modal">
                <div class="modal-header">
                    <h2>⚙️ 設定</h2>
                    <button class="modal-close" id="close-settings">✕</button>
                </div>
                <div class="modal-tabs">
                    <button class="modal-tab active" data-tab="servers">サーバー</button>
                    <button class="modal-tab" data-tab="characters">キャラクター</button>
                    <button class="modal-tab" data-tab="bosses">ボス設定</button>
                </div>
                <div class="modal-body" id="settings-content">
                    <!-- 設定内容はJSで動的生成 -->
                </div>
                <div class="modal-footer">
                    <div class="modal-footer-left">
                        <button class="modal-action-btn" id="export-settings">📤 エクスポート</button>
                        <button class="modal-action-btn" id="import-settings">📥 インポート</button>
                        <span class="help-icon"
                            data-tooltip="データはブラウザに保存されます。キャッシュ削除で消える可能性があるため、定期的にエクスポートでバックアップを取ることをおすすめします。">❓</span>
                        <input type="file" id="import-file" accept=".json" style="display: none;">
                    </div>
                    <button class="modal-save-btn" id="save-settings">保存して閉じる</button>
                </div>
            </div>
        </div>

        <nav class="server-tabs">
            <button class="server-tab active" data-server="all">全サーバー</button>
            <button class="server-tab" data-server="0">かえで</button>
            <button class="server-tab" data-server="1">くるみ</button>
            <button class="server-tab" data-server="2">チャレンジ</button>
        </nav>

        <main class="content" id="main-content">
            <!-- コンテンツはJSで動的生成 -->
        </main>

        <footer>
            <button class="reset-btn" id="reset-server">現在のサーバーをリセット</button>
            <button class="reset-btn danger" id="reset-all">全データをリセット</button>
        </footer>
    </div>

    <!-- サイト移転モーダル -->
    <div class="migration-overlay" id="migration-overlay">
        <div class="migration-modal">
            <h2>⚠️ サイト移転のお知らせ</h2>
            <p>このアプリケーションは新しいURLへ移転しました。</p>
            <p>お手数ですが、以下の手順でデータを引き継いで新しいサイトをご利用ください。</p>
            <div class="migration-steps">
                <div class="step">
                    <p class="step-title">1. 現在のデータを保存する</p>
                    <button id="migration-export-btn" class="migration-btn export-btn">データをエクスポート</button>
                    <p class="step-help">※ ブラウザに保存されている全データをファイルとしてダウンロードします</p>
                </div>
                <div class="step">
                    <p class="step-title">2. 新しいサイトへ移動し、設定からインポートする</p>
                    <a href="https://syasta-lu.com/maplestory-tracker/" class="migration-btn link-btn" rel="noopener noreferrer">新しいサイトへ移動する</a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=3"></script>
    <script>
        // ページ読み込み時に移転モーダルを表示し、メインコンテンツを非表示にする
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.querySelector('.container');
            const overlay = document.getElementById('migration-overlay');
            
            if (container) container.style.display = 'none';
            if (overlay) overlay.style.display = 'flex';
            
            // エクスポートボタンに既存のexportData()をバインド
            const exportBtn = document.getElementById('migration-export-btn');
            if (exportBtn) {
                exportBtn.addEventListener('click', function() {
                    if (typeof exportData === 'function') {
                        exportData();
                    } else {
                        alert('エラー：エクスポート機能が見つかりません。');
                    }
                });
            }
        });
    </script>
</body>

</html>
