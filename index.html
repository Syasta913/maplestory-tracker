<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メイプルストーリー ボス・クエスト管理</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>🍄 Maplestory Tracker 🍁</h1 <p class="subtitle">週間・月間ボス & ウィークリークエスト トラッカー</p>
        </header>

        <div class="reset-info">
            <div class="reset-item current-time-item">
                <span class="label">現在</span>
                <span id="current-datetime" class="countdown current-time">--</span>
            </div>
            <div class="reset-item">
                <span class="label">週間リセットまで</span>
                <span id="weekly-countdown" class="countdown">--</span>
            </div>
            <div class="reset-item">
                <span class="label">月間リセットまで</span>
                <span id="monthly-countdown" class="countdown">--</span>
            </div>
            <button class="settings-btn" id="open-settings" title="設定">⚙️</button>
            <a href="https://syasta913.github.io/LVUP-Planner/" class="external-link-btn" target="_blank"
                rel="noopener noreferrer">育成プラン(別ページ)</a>
        </div>

        <!-- 設定モーダル -->
        <div class="modal-overlay" id="settings-modal">
            <div class="modal">
                <div class="modal-header">
                    <h2>⚙️ 設定</h2>
                    <button class="modal-close" id="close-settings">✕</button>
                </div>
                <div class="modal-tabs">
                    <button class="modal-tab active" data-tab="servers">サーバー</button>
                    <button class="modal-tab" data-tab="characters">キャラクター</button>
                    <button class="modal-tab" data-tab="bosses">ボス設定</button>
                </div>
                <div class="modal-body" id="settings-content">
                    <!-- 設定内容はJSで動的生成 -->
                </div>
                <div class="modal-footer">
                    <div class="modal-footer-left">
                        <button class="modal-action-btn" id="export-settings">📤 エクスポート</button>
                        <button class="modal-action-btn" id="import-settings">📥 インポート</button>
                        <span class="help-icon"
                            data-tooltip="データはブラウザに保存されます。キャッシュ削除で消える可能性があるため、定期的にエクスポートでバックアップを取ることをおすすめします。">❓</span>
                        <input type="file" id="import-file" accept=".json" style="display: none;">
                    </div>
                    <button class="modal-save-btn" id="save-settings">保存して閉じる</button>
                </div>
            </div>
        </div>

        <nav class="server-tabs">
            <button class="server-tab active" data-server="all">全サーバー</button>
            <button class="server-tab" data-server="0">かえで</button>
            <button class="server-tab" data-server="1">くるみ</button>
            <button class="server-tab" data-server="2">チャレンジ</button>
        </nav>

        <main class="content" id="main-content">
            <!-- コンテンツはJSで動的生成 -->
        </main>

        <footer>
            <button class="reset-btn" id="reset-server">現在のサーバーをリセット</button>
            <button class="reset-btn danger" id="reset-all">全データをリセット</button>
        </footer>
    </div>

    <script src="app.js?v=2"></script>
    <script>
        // ページ読み込み時に免責事項チェック
        document.addEventListener('DOMContentLoaded', function () {
            if (!checkDisclaimer()) {
                // 免責事項未同意の場合、メインコンテンツを非表示
                document.querySelector('.container').style.display = 'none';
            }
        });
    </script>
</body>

</html>
